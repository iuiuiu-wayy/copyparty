# fork-only: nginx site file for copyparty on the Pi, HTTPS from the internet.
#
# Placeholders to fill in on the Pi (the repo is public, so it holds no real values):
#   __DOMAIN__   the domain the certificate is for, e.g. files.example.org
#   __HOME_IP__  the home's static IP, e.g. 203.0.113.7
#
# Inside and Outside: a request whose connection comes from __HOME_IP__ is Inside (the router's
# NAT loopback makes every device at home arrive from that address) and reaches the whole site.
# Every other request is Outside and reaches only share links and copyparty's static files;
# anything else gets nginx's bare 404, whatever the method, with no hint that a login exists.
# Only the connection's source address decides; no header (X-Forwarded-For, X-Real-IP) counts.
# If the ISP changes the home IP, home becomes Outside: share links still work, nothing opens.
#
# Goes in nginx's http context (a sites-enabled/ or conf.d/ file). copyparty's side, in its own
# config: i: 127.0.0.1 (localhost only), rproxy: -1 (trust the address nginx appends), http-only,
# shr: /share/ (the share-link area must match the "location /share/" below).
# Checked locally, against a real copyparty and nginx 1.30, by scripts/fork-https-check.sh.

upstream fork_copyparty {
	# copyparty listens on localhost only, so nginx is the only way in
	server 127.0.0.1:3923 fail_timeout=1s;
	keepalive 1;
}

# 1 for Outside, 0 for Inside; geo reads the connection's own address ($remote_addr; this file
# sets no real_ip or geo "proxy", so no header can change it)
geo $fork_outside {
	default     1;
	__HOME_IP__ 0;
}

# port 80 only sends visitors to HTTPS
server {
	listen 80;
	server_name __DOMAIN__;
	server_tokens off;

	return 301 https://$host$request_uri;
}

server {
	# no "http2" here, on purpose: keeps nginx's HTTP/2 code (NGINX2Root) out of reach
	listen 443 ssl;
	server_name __DOMAIN__;
	server_tokens off;  # no nginx version in headers or error pages

	ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

	# uploads of any size: copyparty applies its own limits; nginx's default stops at 1 MiB
	client_max_body_size 0;
	client_header_timeout 610m;
	client_body_timeout 610m;
	send_timeout 610m;

	# how every location below talks to copyparty
	proxy_redirect off;
	# HTTP/1.1 to copyparty, streamed both ways (no buffering of uploads or downloads)
	proxy_http_version 1.1;
	proxy_buffering off;
	proxy_request_buffering off;
	proxy_buffers 32 8k;
	proxy_buffer_size 16k;
	proxy_busy_buffers_size 24k;
	proxy_read_timeout 610m;
	proxy_send_timeout 610m;

	proxy_set_header Connection "Keep-Alive";
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	# built by nginx: the visitor's own X-Forwarded-For plus their real address last;
	# copyparty (rproxy: -1) takes only that last entry, so a forged header changes nothing
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

	# everything that is not a share link or a static file: Inside only. The two exact ones are
	# there so that "/share" and "/.cpr" (no slash) get this 404 too, not nginx's own redirect
	# to the folder (which wins over any regex location)
	location = /share {
		if ($fork_outside) {
			return 404;
		}
		proxy_pass http://fork_copyparty;
	}
	location = /.cpr {
		if ($fork_outside) {
			return 404;
		}
		proxy_pass http://fork_copyparty;
	}
	location / {
		if ($fork_outside) {
			return 404;
		}
		proxy_pass http://fork_copyparty;
	}

	# share links (copyparty's shr), for everyone: the share pages, their password prompt,
	# downloads, zips, thumbnails and uploads into a share link
	location /share/ {
		proxy_pass http://fork_copyparty;
	}

	# copyparty's static files (styles, scripts, icons), which share pages load
	location /.cpr/ {
		proxy_pass http://fork_copyparty;
	}
}
