# fork-only: nginx site file for copyparty on the Pi, HTTPS from the internet, where Outside
# opens only share links. To put it on the Pi and confirm it by hand, step by step:
# docs/fork-https-outside-pi.md. Checked locally, against a real copyparty and nginx 1.30, by
# scripts/fork-https-check.sh (re-run it after any edit here).
#
# Two placeholders to fill in on the Pi (the repo is public, so it holds no real values):
#   __DOMAIN__   the domain the certificate is for, e.g. files.example.org (5 places)
#   __HOME_IP__  the home's static IP, the domain's A record, e.g. 203.0.113.7 (1 place)
#
# Inside and Outside: a request whose connection comes from __HOME_IP__ is Inside and reaches
# the whole site, with no rate limits. Inside is that one address because the router's NAT
# loopback makes every device at home (guest Wi-Fi and ESP boards too) arrive from it; nginx
# never sees a LAN address. Every other request is Outside and reaches only share links
# (/share/) and copyparty's static files (/.cpr/, GET and HEAD only, with no login: nginx drops
# the Authorization, Cookie and PW headers and the query string there); anything else gets
# nginx's bare 404, whatever the method, with no hint that a login exists. Outside is rate-limited per address (429).
# Only the connection's source address decides; no header (X-Forwarded-For, X-Real-IP) counts.
# If the ISP changes the home IP, home becomes Outside: share links still work, nothing opens.
#
# The parts, top to bottom:
#   upstream fork_copyparty   copyparty on 127.0.0.1:3923, the only way in to it
#   geo $fork_outside         Inside (0) or Outside (1), from the source address only
#   map / limit_*_zone        the rate-limit key (empty for Inside, so never counted) and zones
#   map / log_format          the access-log line: "combined" plus the host asked for (the
#                             domain, or a bare IP from a scanner) and inside/outside
#   map $fork_cpr_* ...       Outside on /.cpr/: which methods, and the login headers dropped
#   server :80                only redirects to https://__DOMAIN__ (and certbot's renewal)
#   server :443               TLS, upload sizes and timeouts, rate limits, how nginx talks to
#                             copyparty, then the locations: Outside's 404 and the two open paths
# Every name above (fork_copyparty, $fork_outside, $fork_limit_key, $fork_where, $fork_cpr_out,
# $fork_cpr_deny, $fork_authorization, $fork_cookie, $fork_pw, the zones fork_outside_req and
# fork_outside_conn, the log format fork_host) is nginx-wide: no other site
# file on the same nginx may define it again.
#
# nginx: nginx.org's stable package, 1.30.7 or later (the NGINX2Root fixes; Debian 12's 1.22 is
# not fixed). No "http2" on any listen line, on purpose: it keeps nginx's HTTP/2 code out of reach.
#
# certbot (--nginx) owns the certificate lines (ssl_certificate, ssl_certificate_key, the include
# and ssl_dhparam marked "managed by Certbot") and the port-80 renewal. A renewal edits this file
# for a moment: into each server whose server_name is __DOMAIN__ it adds a "rewrite ... break"
# (which skips the "return 301") and an exact location for the challenge token, reloads nginx,
# then puts the file back byte for byte. So: keep "server_name __DOMAIN__" on the port-80 server,
# add no ACME location by hand, and after any edit run: sudo certbot renew --dry-run
#
# Goes in nginx's http context (nginx.org's package: /etc/nginx/conf.d/copyparty.conf).
# copyparty's side, in its own config: i: 127.0.0.1 (localhost only), rproxy: -1 (trust the
# address nginx appends), http-only, shr: /share/ (must match "location /share/" below).

upstream fork_copyparty {
	# copyparty listens on localhost only, so nginx is the only way in
	server 127.0.0.1:3923 fail_timeout=1s;
	keepalive 1;
}

# 1 for Outside, 0 for Inside; geo reads the connection's own address ($remote_addr; this file
# sets no real_ip or geo "proxy", so no header can change it)
geo $fork_outside {
	default     1;
	__HOME_IP__ 0;
}

# rate limits, per address and for Outside only: Inside's key is empty, and nginx never counts
# an empty key (the whole household arrives as the one home IP, so it must not share a limit)
map $fork_outside $fork_limit_key {
	1       $binary_remote_addr;
	default "";
}
# 20 requests a second; the burst (200, at limit_req below) lets a share page with many
# thumbnails load at once
limit_req_zone  $fork_limit_key zone=fork_outside_req:1m rate=20r/s;
limit_conn_zone $fork_limit_key zone=fork_outside_conn:1m;

# the access log: nginx's usual "combined" line plus the host the request asked for (the domain,
# or a bare IP from a scanner) and inside/outside, so a night's log shows both at a glance
map $fork_outside $fork_where {
	1       outside;
	default inside;
}
log_format fork_host '$remote_addr - $remote_user [$time_local] "$request" $status '
                     '$body_bytes_sent "$http_referer" "$http_user_agent" "$host" $fork_where';

# Outside on copyparty's static files (/.cpr/), which share pages load: they need no login, and
# copyparty would otherwise take one there (a password to try, a session cookie, then POSTs
# like ?share). So for Outside: only GET and HEAD ($fork_cpr_deny), and no Authorization,
# Cookie or PW header ($fork_cpr_out empties them; nginx sends no header whose value is empty).
# Everyone else, and every other path, passes them as sent
map "$fork_outside:$request_method" $fork_cpr_deny {
	"1:GET"  0;
	"1:HEAD" 0;
	"~^1:"   1;
	default  0;
}
map "$fork_outside:$uri" $fork_cpr_out {
	"~^1:/\.cpr/" 1;
	default       0;
}
map $fork_cpr_out $fork_authorization {
	1       "";
	default $http_authorization;
}
map $fork_cpr_out $fork_cookie {
	1       "";
	default $http_cookie;
}
map $fork_cpr_out $fork_pw {
	1       "";
	default $http_pw;
}

# port 80 only sends visitors to HTTPS, on the domain whatever Host they asked for (not
# $host: that would redirect to any name a request carries)
server {
	listen 80;
	server_name __DOMAIN__;
	server_tokens off;
	access_log /var/log/nginx/access.log fork_host;

	return 301 https://__DOMAIN__$request_uri;
}

server {
	# no "http2" here, on purpose: keeps nginx's HTTP/2 code (NGINX2Root) out of reach
	listen 443 ssl;
	server_name __DOMAIN__;
	server_tokens off;  # no nginx version in headers or error pages
	access_log /var/log/nginx/access.log fork_host;

	ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
	# certbot's TLS settings (protocols, ciphers, session cache), written by "certbot --nginx"
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

	# uploads of any size: copyparty applies its own limits; nginx's default stops at 1 MiB
	client_max_body_size 0;
	# a request header is small and comes at once; short, since limit_conn counts a connection
	# only once its header is in (a long timeout would let anyone hold connections uncounted).
	# Long uploads and downloads need only the body, send and proxy timeouts
	client_header_timeout 10s;
	client_body_timeout 610m;
	send_timeout 610m;

	# Outside, per address: past a burst of 200 requests, or with 32 already open, 429
	limit_req zone=fork_outside_req burst=200 nodelay;
	limit_conn fork_outside_conn 32;
	limit_req_status 429;
	limit_conn_status 429;

	# how every location below talks to copyparty
	proxy_redirect off;
	# HTTP/1.1 to copyparty, streamed both ways (no buffering of uploads or downloads)
	proxy_http_version 1.1;
	proxy_buffering off;
	proxy_request_buffering off;
	proxy_buffers 32 8k;
	proxy_buffer_size 16k;
	proxy_busy_buffers_size 24k;
	proxy_read_timeout 610m;
	proxy_send_timeout 610m;

	proxy_set_header Connection "Keep-Alive";
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	# built by nginx: the visitor's own X-Forwarded-For plus their real address last;
	# copyparty (rproxy: -1) takes only that last entry, so a forged header changes nothing
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	# the login headers, as sent, except Outside on /.cpr/ (the maps above)
	proxy_set_header Authorization $fork_authorization;
	proxy_set_header Cookie $fork_cookie;
	proxy_set_header PW $fork_pw;

	# everything that is not a share link or a static file: Inside only. The two exact ones are
	# there so that "/share" and "/.cpr" (no slash) get this 404 too, not nginx's own redirect
	# to the folder (which wins over any regex location). Outside goes to the 404 below
	location = /share {
		if ($fork_outside) {
			rewrite ^ /.fork-outside-404 last;
		}
		proxy_pass http://fork_copyparty;
	}
	location = /.cpr {
		if ($fork_outside) {
			rewrite ^ /.fork-outside-404 last;
		}
		proxy_pass http://fork_copyparty;
	}
	location / {
		if ($fork_outside) {
			rewrite ^ /.fork-outside-404 last;
		}
		proxy_pass http://fork_copyparty;
	}
	# Outside's bare 404, for every method. Not a plain "return 404" up there: that runs before
	# the rate limits, so a scanner would get 404 forever and never 429. try_files runs after
	# them; /nonexistent is a folder that never exists, so it always ends in =404. internal:
	# no one can ask for this path (Inside asking for it gets the same 404)
	location = /.fork-outside-404 {
		internal;
		root /nonexistent;
		try_files $uri =404;
	}

	# share links (copyparty's shr), for everyone: the share pages, their password prompt,
	# downloads, zips, thumbnails and uploads into a share link
	location /share/ {
		proxy_pass http://fork_copyparty;
	}

	# copyparty's static files (styles, scripts, icons), which share pages load. Outside: GET and
	# HEAD only (else the bare 404), with no query string (the trailing "?" drops it; a "?" hidden
	# in the path as %3F is passed on still escaped) and no login headers (the maps above)
	location /.cpr/ {
		if ($fork_cpr_deny) {
			rewrite ^ /.fork-outside-404 last;
		}
		if ($fork_outside) {
			rewrite ^ $uri? break;
		}
		proxy_pass http://fork_copyparty;
	}
}
