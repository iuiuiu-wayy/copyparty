# fork-disk-alert's config: copy to /etc/fork-disk-alert/fork-disk-alert.conf and
# fill in the <...> values. No password here: it goes in
# /etc/fork-disk-alert/smtp-password (see README.md).

[alert]
# a disk counts as nearly full at this percentage used
threshold = 90
# while any disk stays full or missing, mail again after this many hours
repeat-hours = 24

[disks]
# name = mount point; a name is only what the mail calls the disk.
# A disk is missing when nothing is mounted at its mount point.
ssd = /mnt/ssd
ssd2 = /mnt/ssd2
hdd1 = /mnt/hdd1
hdd2 = /mnt/hdd2
# the SD card the system runs from (logs, copyparty's salt and chpw.json)
sd-card = /

[smtp]
# Gmail: smtp.gmail.com, security ssl on port 465, user = the Gmail address,
# password = an app password (Google account > Security > 2-Step Verification >
# App passwords); free, up to about 500 mails a day
host = smtp.gmail.com
security = ssl
port = 465
user = <your-gmail-address>
# defaults to user
from =
# where the alerts go (may be the same address)
to = <where-to-send-alerts>
